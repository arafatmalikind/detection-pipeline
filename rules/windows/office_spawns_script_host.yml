title: Office application spawns a script interpreter
id: d2407ea3-c825-4340-9f60-9b065d008f8e
status: stable
description: |
  Word, Excel, PowerPoint or Outlook starting a shell or script host. Almost
  always a macro or an exploited document. Legitimate add-ins that do this
  should be whitelisted by full parent command line, not by parent image.
author: Arafat Malik
date: 2026-03-14
modified: 2026-08-02
tags:
  - attack.initial_access
  - attack.execution
  - attack.t1566.001
  - attack.t1059
logsource:
  product: windows
  category: process_creation
detection:
  parent:
    ParentImage|endswith:
      - '\winword.exe'
      - '\excel.exe'
      - '\powerpnt.exe'
      - '\outlook.exe'
  child:
    Image|endswith:
      - '\powershell.exe'
      - '\pwsh.exe'
      - '\cmd.exe'
      - '\wscript.exe'
      - '\cscript.exe'
      - '\mshta.exe'
  condition: parent and child
falsepositives:
  - Finance workbooks that shell out to legacy reporting tools
level: high
