    ServiceName: 'UpdSvc'
    ImagePath: 'C:\Users\Public\svc.exe'
  - EventID: 7045
    ServiceName: 'xQm1'
    ImagePath: '%COMSPEC% /c C:\Windows\Temp\a.bat'

no_match:
